# This is a Declarative Automation Bundle definition for Azure_DE_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Azure_DE_project
  uuid: 04160be5-cc35-4b37-9835-54d2cc115f9b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-461dacb9-6782.cloud.databricks.com
    variables:
      catalog: databricks_dev
      schema: dev
      warehouse_id: 032718d296e7344e
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-461dacb9-6782.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/charangade01@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Azure_DE_databricks
    variables:
      catalog: databricks_prod
      schema: prod
      warehouse_id: 032718d296e7344e
    permissions:
      - user_name: charangade01@gmail.com
        level: CAN_MANAGE
